<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Study Room</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const socket = io('https://study-room-backend-syn8.onrender.com');

        function App() {
            const [username, setUsername] = React.useState('');
            const [roomCode, setRoomCode] = React.useState('');
            const [isInRoom, setIsInRoom] = React.useState(false);
            const [message, setMessage] = React.useState('');
            const [chatList, setChatList] = React.useState([]);
            const [noteText, setNoteText] = React.useState('');
            const [timeLeft, setTimeLeft] = React.useState(1500);
            const [darkMode, setDarkMode] = React.useState(false);

            React.useEffect(() => {
                socket.on('receive_message', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_note', (data) => {
                    setNoteText(data);
                });

                socket.on('load_note', (data) => {
                    setNoteText(data);
                });

                socket.on('timer_update', (time) => {
                    setTimeLeft(time);
                });
            }, []);

            const joinRoom = () => {
                if (username !== '' && roomCode !== '') {
                    socket.emit('join_room', { username, roomCode });
                    setIsInRoom(true);
                }
            };

            const sendMessage = (e) => {
                e.preventDefault();
                if (message !== '') {
                    const messageData = {
                        roomCode,
                        username,
                        message,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_message', messageData);
                    setChatList((list) => [...list, messageData]);
                    setMessage('');
                }
            };

            const handleNoteChange = (e) => {
                const text = e.target.value;
                setNoteText(text);
                socket.emit('update_note', { roomCode, text });
            };

            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            if (!isInRoom) {
                return (
                    <div className={`flex flex-col items-center justify-center h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                        <div className={`p-8 rounded-lg shadow-md text-center w-80 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold text-blue-500">Join Room</h2>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="text-xs px-2 py-1 rounded border border-gray-500 hover:bg-gray-700">
                                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>
                            <input
                                type="text"
                                placeholder="Your Name..."
                                className={`border p-2 mb-3 w-full rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setUsername(e.target.value)}
                            /><br/>
                            <input
                                type="text"
                                placeholder="Room Code (e.g. 123)..."
                                className={`border p-2 mb-4 w-full rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setRoomCode(e.target.value)}
                            /><br/>
                            <button 
                                onClick={joinRoom} 
                                className="bg-blue-500 text-white px-4 py-2 rounded w-full hover:bg-blue-600 font-semibold">
                                Enter Study Room
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                    {/* Left Column: Chat */}
                    <div className={`w-1/3 border-r flex flex-col p-4 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-300'}`}>
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold text-sm">Room: {roomCode} | {username}</h3>
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="text-xs px-2 py-1 rounded border border-gray-500 hover:opacity-80">
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                        </div>
                        <div className={`flex-1 border overflow-y-auto p-3 mb-3 rounded ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                            {chatList.map((item, index) => (
                                <div key={index} className="mb-2">
                                    <span className="font-bold text-blue-400">{item.username}</span> 
                                    <span className="text-xs text-gray-400 ml-2">{item.time}</span>
                                    <p className={darkMode ? 'text-gray-200' : 'text-gray-700'}>{item.message}</p>
                                </div>
                            ))}
                        </div>
                        <form onSubmit={sendMessage} className="flex gap-2">
                            <input
                                type="text"
                                value={message}
                                placeholder="Type a message..."
                                className={`border flex-1 p-2 rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setMessage(e.target.value)}
                            />
                            <button type="submit" className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Send</button>
                        </form>
                    </div>

                    {/* Right Column: Timer & Shared Notes */}
                    <div className={`flex-1 flex flex-col p-4 gap-4 ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`}>
                        {/* Pomodoro Timer Widget */}
                        <div className={`p-4 rounded-lg shadow-md flex items-center justify-between ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <div>
                                <h3 className={`font-bold text-md ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Study Timer (Pomodoro)</h3>
                                <div className="text-3xl font-extrabold text-blue-400 mt-1">{formatTime(timeLeft)}</div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => socket.emit('start_timer', roomCode)} className="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">Start</button>
                                <button onClick={() => socket.emit('pause_timer', roomCode)} className="bg-yellow-600 text-white px-3 py-1 rounded text-sm hover:bg-yellow-700">Pause</button>
                                <button onClick={() => socket.emit('reset_timer', roomCode)} className="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Reset</button>
                            </div>
                        </div>

                        {/* Shared Workspace */}
                        <div className={`flex-1 flex flex-col p-4 rounded-lg shadow-md ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <h3 className="font-bold text-lg mb-2">Shared Workspace / Notes</h3>
                            <textarea
                                value={noteText}
                                onChange={handleNoteChange}
                                placeholder="Type notes here. Everyone in room will see live updates!"
                                className={`flex-1 border p-4 rounded resize-none focus:outline-none ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-white border-gray-200 text-black'}`}
                            />
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
