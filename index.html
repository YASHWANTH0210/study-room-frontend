<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Ultimate Study Room</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const socket = io('https://study-room-backend-syn8.onrender.com');

        // Theme Definitions (5 custom themes)
        const THEMES = {
            blue: {
                name: 'Classic Blue',
                primary: 'bg-blue-600 hover:bg-blue-700 text-white',
                primaryText: 'text-blue-500',
                accentBg: 'bg-blue-50 border-blue-200 text-blue-800',
                darkAccentBg: 'bg-gray-800 border-blue-900 text-blue-300',
                badge: 'bg-blue-500 text-white',
                tabActive: 'bg-blue-600 text-white',
                borderActive: 'border-blue-500',
            },
            emerald: {
                name: 'Emerald Forest',
                primary: 'bg-emerald-600 hover:bg-emerald-700 text-white',
                primaryText: 'text-emerald-500',
                accentBg: 'bg-emerald-50 border-emerald-200 text-emerald-800',
                darkAccentBg: 'bg-gray-800 border-emerald-900 text-emerald-300',
                badge: 'bg-emerald-500 text-white',
                tabActive: 'bg-emerald-600 text-white',
                borderActive: 'border-emerald-500',
            },
            purple: {
                name: 'Sunset Purple',
                primary: 'bg-purple-600 hover:bg-purple-700 text-white',
                primaryText: 'text-purple-500',
                accentBg: 'bg-purple-50 border-purple-200 text-purple-800',
                darkAccentBg: 'bg-gray-800 border-purple-900 text-purple-300',
                badge: 'bg-purple-500 text-white',
                tabActive: 'bg-purple-600 text-white',
                borderActive: 'border-purple-500',
            },
            midnight: {
                name: 'Dark Midnight',
                primary: 'bg-indigo-600 hover:bg-indigo-700 text-white',
                primaryText: 'text-indigo-400',
                accentBg: 'bg-slate-800 border-slate-700 text-indigo-300',
                darkAccentBg: 'bg-slate-800 border-indigo-900 text-indigo-300',
                badge: 'bg-indigo-600 text-white',
                tabActive: 'bg-indigo-600 text-white',
                borderActive: 'border-indigo-500',
            },
            latte: {
                name: 'Warm Latte',
                primary: 'bg-amber-700 hover:bg-amber-800 text-white',
                primaryText: 'text-amber-700',
                accentBg: 'bg-amber-50 border-amber-200 text-amber-900',
                darkAccentBg: 'bg-gray-800 border-amber-900 text-amber-400',
                badge: 'bg-amber-700 text-white',
                tabActive: 'bg-amber-700 text-white',
                borderActive: 'border-amber-600',
            }
        };

        function App() {
            // User Profile States
            const [username, setUsername] = React.useState(() => localStorage.getItem('study_username') || '');
            const [userAvatar, setUserAvatar] = React.useState(() => localStorage.getItem('study_avatar') || '🎓');
            const [userStatus, setUserStatus] = React.useState(() => localStorage.getItem('study_status') || 'Student');

            // Theme State (persisted in localStorage)
            const [currentThemeKey, setCurrentThemeKey] = React.useState(() => localStorage.getItem('study_theme') || 'blue');
            const theme = THEMES[currentThemeKey] || THEMES.blue;

            // Room History State
            const [roomHistory, setRoomHistory] = React.useState(() => {
                const saved = localStorage.getItem('study_room_history');
                return saved ? JSON.parse(saved) : [];
            });

            const [roomCode, setRoomCode] = React.useState('');
            const [roomPassword, setRoomPassword] = React.useState('');
            const [roomDuration, setRoomDuration] = React.useState('60');
            const [roomTopic, setRoomTopic] = React.useState('');
            const [roomRules, setRoomRules] = React.useState('');

            const [errorMessage, setErrorMessage] = React.useState('');
            const [isInRoom, setIsInRoom] = React.useState(false);
            const [homeMode, setHomeMode] = React.useState('home');

            const [message, setMessage] = React.useState('');
            const [chatList, setChatList] = React.useState([]);
            const [noteText, setNoteText] = React.useState('');
            const [timeLeft, setTimeLeft] = React.useState(1500);
            const [darkMode, setDarkMode] = React.useState(false);
            const [activeUsers, setActiveUsers] = React.useState([]);
            const [isMobile, setIsMobile] = React.useState(false);

            // Todo List State
            const [todos, setTodos] = React.useState(() => {
                const saved = localStorage.getItem('study_todos');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'Review Chapter Notes', done: false },
                    { id: 2, text: 'Solve 5 Practice Problems', done: false }
                ];
            });
            const [newTodoText, setNewTodoText] = React.useState('');

            // Ambient Sound States
            const [activeSound, setActiveSound] = React.useState('none');
            const audioCtxRef = React.useRef(null);
            const noiseNodeRef = React.useRef(null);
            const gainNodeRef = React.useRef(null);

            React.useEffect(() => {
                const checkMobile = () => {
                    const mobileCheck = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    setIsMobile(mobileCheck);
                };
                checkMobile();
            }, []);
            
            const [activeSection, setActiveSection] = React.useState('workspace');
            const [workspaceTab, setWorkspaceTab] = React.useState('notes');

            // Voice Chat States
            const [isInVoice, setIsInVoice] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const localStreamRef = React.useRef(null);
            const peersRef = React.useRef([]);

            // Whiteboard Refs
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [brushColor, setBrushColor] = React.useState('#3b82f6');
            const [brushSize, setBrushSize] = React.useState(3);
            const lastPosRef = React.useRef({ x: 0, y: 0 });

            React.useEffect(() => {
                socket.on('receive_message', (data) => setChatList((list) => [...list, data]));
                socket.on('receive_file', (data) => setChatList((list) => [...list, data]));
                socket.on('receive_note', (data) => setNoteText(data));
                socket.on('load_note', (data) => setNoteText(data));
                socket.on('timer_update', (time) => setTimeLeft(time));
                socket.on('update_users', (users) => setActiveUsers(users));
                socket.on('auth_success', () => {
                    setIsInRoom(true);
                    setErrorMessage('');
                    saveToRoomHistory(roomCode, roomTopic || 'General Study');
                });
                socket.on('auth_error', (msg) => setErrorMessage(msg));
                socket.on('receive_drawing', (data) => drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size, false));
                socket.on('clear_board', () => clearCanvasLocally());
            }, [roomCode, roomTopic]);

            const changeTheme = (key) => {
                setCurrentThemeKey(key);
                localStorage.setItem('study_theme', key);
            };

            const saveProfile = (e) => {
                e.preventDefault();
                if (!username.trim()) {
                    setErrorMessage('Please enter a valid name.');
                    return;
                }
                localStorage.setItem('study_username', username);
                localStorage.setItem('study_avatar', userAvatar);
                localStorage.setItem('study_status', userStatus);
                setErrorMessage('');
                setHomeMode('home');
            };

            const saveToRoomHistory = (code, topic) => {
                const newEntry = { code, topic, date: new Date().toLocaleDateString() };
                setRoomHistory((prev) => {
                    const filtered = prev.filter(item => item.code !== code);
                    const updated = [newEntry, ...filtered].slice(0, 5);
                    localStorage.setItem('study_room_history', JSON.stringify(updated));
                    return updated;
                });
            };

            const clearHistory = () => {
                localStorage.removeItem('study_room_history');
                setRoomHistory([]);
            };

            const generateRoomCode = () => {
                const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(randomCode);
            };

            const addTodo = (e) => {
                e.preventDefault();
                if (!newTodoText.trim()) return;
                const updated = [...todos, { id: Date.now(), text: newTodoText, done: false }];
                setTodos(updated);
                localStorage.setItem('study_todos', JSON.stringify(updated));
                setNewTodoText('');
            };

            const toggleTodo = (id) => {
                const updated = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
                setTodos(updated);
                localStorage.setItem('study_todos', JSON.stringify(updated));
            };

            const deleteTodo = (id) => {
                const updated = todos.filter(t => t.id !== id);
                setTodos(updated);
                localStorage.setItem('study_todos', JSON.stringify(updated));
            };

            const playAmbientSound = (type) => {
                stopAmbientSound();
                if (type === 'none') {
                    setActiveSound('none');
                    return;
                }

                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();

                    if (ctx.state === 'suspended') {
                        ctx.resume();
                    }

                    audioCtxRef.current = ctx;

                    const bufferSize = ctx.sampleRate * 2;
                    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);

                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        if (type === 'rain') {
                            output[i] = (white * 0.2); 
                        } else if (type === 'whitenoise') {
                            output[i] = white * 0.1;
                        } else if (type === 'brownnoise') {
                            output[i] = (i === 0 ? white : (output[i-1] + (0.02 * white))) * 0.5;
                        }
                    }

                    const whiteNoise = ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    whiteNoise.loop = true;

                    const filter = ctx.createBiquadFilter();
                    if (type === 'rain') {
                        filter.type = 'lowpass';
                        filter.frequency.value = 1000;
                    } else if (type === 'brownnoise') {
                        filter.type = 'lowpass';
                        filter.frequency.value = 350;
                    } else {
                        filter.type = 'bandpass';
                        filter.frequency.value = 1500;
                    }

                    const gainNode = ctx.createGain();
                    gainNode.gain.value = 0.2;
                    gainNodeRef.current = gainNode;

                    whiteNoise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    whiteNoise.start(0);
                    noiseNodeRef.current = whiteNoise;
                    setActiveSound(type);
                } catch (err) {
                    console.error("Audio playback error:", err);
                    alert("Audio playback failed. Please click the sound button again.");
                }
            };

            const stopAmbientSound = () => {
                if (noiseNodeRef.current) {
                    try { noiseNodeRef.current.stop(); } catch(e) {}
                    noiseNodeRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch(e) {}
                    audioCtxRef.current = null;
                }
                setActiveSound('none');
            };

            const getPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => { e.preventDefault(); setIsDrawing(true); lastPosRef.current = getPos(e); };
            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                drawLine(lastPosRef.current.x, lastPosRef.current.y, pos.x, pos.y, brushColor, brushSize, true);
                lastPosRef.current = pos;
            };
            const stopDrawing = () => setIsDrawing(false);

            const drawLine = (x0, y0, x1, y1, color, size, emit) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.closePath();
                if (emit) socket.emit('drawing', { roomCode, x0, y0, x1, y1, color, size });
            };

            const clearCanvasLocally = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const clearBoard = () => {
                clearCanvasLocally();
                socket.emit('clear_board', roomCode);
            };

            const toggleVoiceChat = async () => {
                if (!isInVoice) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        localStreamRef.current = stream;
                        setIsInVoice(true);
                        socket.emit('join_voice', roomCode);

                        socket.on('user_joined_voice', (incomingId) => {
                            const peer = createPeer(incomingId, stream);
                            peersRef.current.push({ peerId: incomingId, peer });
                        });

                        socket.on('signal', (data) => {
                            const item = peersRef.current.find(p => p.peerId === data.from);
                            if (item) item.peer.signal(data.signal);
                            else {
                                const peer = addPeer(data.signal, data.from, stream);
                                peersRef.current.push({ peerId: data.from, peer });
                            }
                        });

                        socket.on('user_left_voice', (id) => {
                            const item = peersRef.current.find(p => p.peerId === id);
                            if (item) {
                                item.peer.destroy();
                                peersRef.current = peersRef.current.filter(p => p.peerId !== id);
                            }
                        });
                    } catch (err) {
                        alert('Microphone access blocked or unavailable.');
                    }
                } else {
                    if (localStreamRef.current) localStreamRef.current.getTracks().forEach(t => t.stop());
                    peersRef.current.forEach(p => p.peer.destroy());
                    peersRef.current = [];
                    setIsInVoice(false);
                    socket.emit('leave_voice', roomCode);
                }
            };

            const createPeer = (userToSignal, stream) => {
                const peer = new SimplePeer({ initiator: true, trickle: false, stream, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
                peer.on('signal', (signal) => socket.emit('signal', { to: userToSignal, signal }));
                peer.on('stream', (remoteStream) => playRemoteAudio(remoteStream));
                return peer;
            };

            const addPeer = (incomingSignal, callerId, stream) => {
                const peer = new SimplePeer({ initiator: false, trickle: false, stream, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
                peer.on('signal', (signal) => socket.emit('signal', { to: callerId, signal }));
                peer.on('stream', (remoteStream) => playRemoteAudio(remoteStream));
                peer.signal(incomingSignal);
                return peer;
            };

            const playRemoteAudio = (stream) => {
                const audio = document.createElement('audio');
                audio.srcObject = stream;
                audio.autoplay = true;
                document.body.appendChild(audio);
            };

            const toggleMute = () => {
                if (localStreamRef.current) {
                    const audioTrack = localStreamRef.current.getAudioTracks()[0];
                    audioTrack.enabled = !audioTrack.enabled;
                    setIsMuted(!isMuted);
                }
            };

            const enterRoomAction = (codeToJoin = roomCode) => {
                if (!username.trim()) {
                    setErrorMessage('Please set up your profile name first.');
                    setHomeMode('profile');
                    return;
                }
                if (codeToJoin !== '') {
                    socket.emit('join_room', { 
                        username: `${userAvatar} ${username} (${userStatus})`, 
                        roomCode: codeToJoin, 
                        password: roomPassword,
                        duration: roomDuration,
                        topic: roomTopic,
                        rules: roomRules
                    });
                } else {
                    setErrorMessage('Please enter a room code.');
                }
            };

            const sendMessage = (e) => {
                e.preventDefault();
                if (message !== '') {
                    const messageData = {
                        roomCode,
                        username: `${userAvatar} ${username}`,
                        message,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_message', messageData);
                    setChatList((list) => [...list, messageData]);
                    setMessage('');
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const fileData = {
                        roomCode,
                        username: `${userAvatar} ${username}`,
                        fileName: file.name,
                        fileType: file.type,
                        fileUrl: reader.result,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_file', fileData);
                    setChatList((list) => [...list, fileData]);
                };
                reader.readAsDataURL(file);
            };

            const handleNoteChange = (e) => {
                const text = e.target.value;
                setNoteText(text);
                socket.emit('update_note', { roomCode, text });
            };

            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            // HOMEPAGE VIEW
            if (!isInRoom) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen py-6 px-4 ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                        <div className={`p-6 sm:p-8 rounded-2xl shadow-xl text-center w-full max-w-md relative overflow-hidden ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            
                            {/* Cute Header Seating Lounge Illustration */}
                            <div className={`mb-4 p-3 rounded-xl border flex flex-col items-center justify-center relative overflow-hidden ${darkMode ? 'bg-gray-900/60 border-gray-700' : 'bg-gradient-to-b from-indigo-50/80 to-blue-50/30 border-blue-100'}`}>
                                <div className="flex items-end justify-center gap-3 pt-2 pb-1 relative z-10">
                                    
                                    {/* Character 1: Reading Book */}
                                    <div className="flex flex-col items-center animate-bounce duration-1000">
                                        <div className="text-2xl filter drop-shadow">🦊</div>
                                        <div className="w-8 h-3 bg-indigo-200 dark:bg-indigo-900 rounded-full mt-0.5 shadow-inner flex items-center justify-center text-[8px]">📖</div>
                                    </div>

                                    {/* Character 2: Coding on Laptop (Center) */}
                                    <div className="flex flex-col items-center transform -translate-y-1">
                                        <div className="text-3xl filter drop-shadow animate-pulse">🐼</div>
                                        <div className="w-10 h-3.5 bg-blue-300 dark:bg-blue-800 rounded-md mt-0.5 shadow flex items-center justify-center text-[9px] font-mono font-bold text-white">💻</div>
                                    </div>

                                    {/* Character 3: Sipping Coffee / Chill */}
                                    <div className="flex flex-col items-center">
                                        <div className="text-2xl filter drop-shadow">🐨</div>
                                        <div className="w-8 h-3 bg-amber-200 dark:bg-amber-900 rounded-full mt-0.5 shadow-inner flex items-center justify-center text-[8px]">☕</div>
                                    </div>

                                </div>
                                <span className={`text-[10px] font-bold uppercase tracking-wider mt-1 opacity-75 ${theme.primaryText}`}>✨ Cozy Study Club Lounge ✨</span>
                            </div>

                            <div className="flex justify-between items-center mb-4">
                                <button 
                                    onClick={() => setHomeMode('profile')}
                                    className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border transition-all ${darkMode ? 'bg-gray-700 border-gray-600 text-gray-200' : 'bg-gray-50 border-gray-200 text-gray-700'}`}>
                                    <span>{userAvatar}</span>
                                    <span className="truncate max-w-[90px]">{username || 'Set Profile'}</span>
                                </button>
                                <div className="flex gap-2">
                                    <button onClick={() => setHomeMode('themes')} className={`text-xs px-2.5 py-1.5 rounded border border-gray-500 hover:opacity-80 font-semibold ${darkMode ? 'bg-gray-700 text-white' : 'bg-gray-50'}`}>
                                        🎨 Themes
                                    </button>
                                    <button onClick={() => setDarkMode(!darkMode)} className="text-xs px-2.5 py-1.5 rounded border border-gray-500 hover:opacity-80">
                                        {darkMode ? '☀️' : '🌙'}
                                    </button>
                                </div>
                            </div>

                            <h1 className={`text-xl font-extrabold mb-1 ${theme.primaryText}`}>📚 Ultimate Study Room</h1>

                            {errorMessage && (
                                <div className="mb-3 p-2 bg-red-100 text-red-700 text-xs rounded border border-red-300">{errorMessage}</div>
                            )}

                            {homeMode === 'home' && (
                                <div className="flex flex-col gap-3 py-2">
                                    <p className="text-xs text-gray-400 mb-1">Notes, Whiteboard, Voice, Checklist & Ambience synced live.</p>
                                    
                                    <button onClick={() => setHomeMode('create')} className={`${theme.primary} p-3 rounded-xl font-bold shadow text-sm transition-all transform hover:scale-[1.02]`}>
                                        ✨ Create a New Room
                                    </button>
                                    <button onClick={() => setHomeMode('join')} className={`p-3 rounded-xl font-bold border text-sm transition-all hover:scale-[1.02] ${darkMode ? 'border-gray-600 hover:bg-gray-700' : 'border-gray-300 hover:bg-gray-50'}`}>
                                        🚪 Join Existing Room
                                    </button>

                                    {roomHistory.length > 0 && (
                                        <div className="mt-2 text-left">
                                            <div className="flex justify-between items-center mb-1.5">
                                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Recent Rooms</span>
                                                <button onClick={clearHistory} className="text-[10px] text-red-400 hover:underline">Clear</button>
                                            </div>
                                            <div className="flex flex-col gap-1.5 max-h-32 overflow-y-auto pr-1">
                                                {roomHistory.map((item, idx) => (
                                                    <div 
                                                        key={idx}
                                                        onClick={() => { setRoomCode(item.code); enterRoomAction(item.code); }}
                                                        className={`p-2 rounded-lg border text-xs flex justify-between items-center cursor-pointer transition-all hover:translate-x-0.5 ${darkMode ? 'bg-gray-700 border-gray-600 hover:bg-gray-600' : 'bg-gray-50 border-gray-200 hover:bg-gray-100'}`}>
                                                        <div>
                                                            <span className={`font-mono font-bold mr-2 ${theme.primaryText}`}>{item.code}</span>
                                                            <span className="text-gray-300 truncate max-w-[130px] inline-block align-bottom">{item.topic}</span>
                                                        </div>
                                                        <span className="text-[10px] text-gray-400 font-semibold">Rejoin →</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-center gap-4 mt-2">
                                        <button onClick={() => setHomeMode('profile')} className="text-xs p-1 rounded font-semibold underline text-gray-400 hover:opacity-80">
                                            ✏️ Edit Profile
                                        </button>
                                    </div>
                                </div>
                            )}

                            {homeMode === 'themes' && (
                                <div className="flex flex-col text-left gap-2.5">
                                    <h2 className={`text-md font-bold mb-1 ${theme.primaryText}`}>🎨 Customize Theme (5 Styles)</h2>
                                    <p className="text-xs text-gray-400 mb-2">Select your favorite look for the study app:</p>
                                    <div className="flex flex-col gap-2">
                                        {Object.keys(THEMES).map((key) => {
                                            const t = THEMES[key];
                                            const isSelected = currentThemeKey === key;
                                            return (
                                                <button 
                                                    key={key} 
                                                    onClick={() => changeTheme(key)}
                                                    className={`p-3 rounded-xl border text-xs font-bold flex justify-between items-center transition-all ${isSelected ? (darkMode ? 'bg-gray-700 border-blue-400 ring-2 ring-blue-500' : 'bg-blue-50 border-blue-500 ring-2 ring-blue-400') : (darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200')}`}
                                                >
                                                    <span className={darkMode ? 'text-white' : 'text-gray-800'}>{t.name}</span>
                                                    <span className={`px-2 py-1 rounded text-[10px] ${t.badge}`}>{isSelected ? 'Active ✓' : 'Select'}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <div className="flex gap-2 mt-4">
                                        <button onClick={() => setHomeMode('home')} className={`px-4 py-2 rounded-xl text-sm font-semibold border w-full ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>Done</button>
                                    </div>
                                </div>
                            )}

                            {homeMode === 'profile' && (
                                <form onSubmit={saveProfile} className="flex flex-col text-left gap-3">
                                    <h2 className={`text-md font-bold mb-1 ${theme.primaryText}`}>👤 Edit Your Profile</h2>
                                    <label className="text-xs text-gray-400 font-semibold">Choose Avatar Emoji:</label>
                                    <div className="flex gap-2 text-xl">
                                        {['🎓', '💻', '📚', '⚡', '🦉', '🚀', '🧠'].map((emoji) => (
                                            <button type="button" key={emoji} onClick={() => setUserAvatar(emoji)} className={`p-1.5 rounded-lg border ${userAvatar === emoji ? `${theme.badge} scale-110` : darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'}`}>
                                                {emoji}
                                            </button>
                                        ))}
                                    </div>
                                    <label className="text-xs text-gray-400 font-semibold">Your Name:</label>
                                    <input type="text" placeholder="e.g. Alex..." className={`border p-2.5 rounded-xl text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={username} onChange={(e) => setUsername(e.target.value)} />
                                    <label className="text-xs text-gray-400 font-semibold">Study Status / Role:</label>
                                    <input type="text" placeholder="e.g. Exam Prep..." className={`border p-2.5 rounded-xl text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={userStatus} onChange={(e) => setUserStatus(e.target.value)} />
                                    <div className="flex gap-2 mt-4">
                                        <button type="button" onClick={() => setHomeMode('home')} className={`px-4 py-2 rounded-xl text-sm font-semibold border ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>Back</button>
                                        <button type="submit" className={`${theme.primary} px-4 py-2 rounded-xl text-sm font-bold flex-1`}>Save Profile</button>
                                    </div>
                                </form>
                            )}

                            {homeMode === 'create' && (
                                <div className="flex flex-col text-left gap-2.5 max-h-[70vh] overflow-y-auto pr-1">
                                    <h2 className={`text-md font-bold mb-1 ${theme.primaryText}`}>✨ Create a New Study Room</h2>
                                    <label className="text-xs text-gray-400 font-semibold">Room Code:</label>
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="Click generate ->" className={`border p-2.5 rounded-xl text-sm flex-1 font-mono ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={roomCode} onChange={(e) => setRoomCode(e.target.value)} />
                                        <button onClick={generateRoomCode} className="bg-purple-600 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-purple-700">Generate</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-gray-400 font-semibold block mb-1">Duration:</label>
                                            <select value={roomDuration} onChange={(e) => setRoomDuration(e.target.value)} className={`border p-2.5 rounded-xl text-sm w-full ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}>
                                                <option value="30">30 Mins</option>
                                                <option value="60">1 Hour</option>
                                                <option value="90">1.5 Hours</option>
                                                <option value="120">2 Hours</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-400 font-semibold block mb-1">Password:</label>
                                            <input type="password" placeholder="Optional..." className={`border p-2.5 rounded-xl text-sm w-full ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={roomPassword} onChange={(e) => setRoomPassword(e.target.value)} />
                                        </div>
                                    </div>
                                    <label className="text-xs text-gray-400 font-semibold">Study Topic / Subject:</label>
                                    <input type="text" placeholder="e.g. Physics Core..." className={`border p-2.5 rounded-xl text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={roomTopic} onChange={(e) => setRoomTopic(e.target.value)} />
                                    <div className="flex gap-2 mt-3">
                                        <button onClick={() => setHomeMode('home')} className={`px-4 py-2 rounded-xl text-sm font-semibold border ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>Back</button>
                                        <button onClick={() => enterRoomAction(roomCode)} className={`${theme.primary} px-4 py-2 rounded-xl text-sm font-bold flex-1`}>Enter Room</button>
                                    </div>
                                </div>
                            )}

                            {homeMode === 'join' && (
                                <div className="flex flex-col text-left gap-3">
                                    <h2 className={`text-md font-bold mb-1 ${theme.primaryText}`}>🚪 Join an Existing Room</h2>
                                    <label className="text-xs text-gray-400 font-semibold">Room Code:</label>
                                    <input type="text" placeholder="Enter 6-digit room code..." className={`border p-2.5 rounded-xl text-sm font-mono ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={roomCode} onChange={(e) => setRoomCode(e.target.value)} />
                                    <label className="text-xs text-gray-400 font-semibold">Room Password (If required):</label>
                                    <input type="password" placeholder="Room password..." className={`border p-2.5 rounded-xl text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} value={roomPassword} onChange={(e) => setRoomPassword(e.target.value)} />
                                    <div className="flex gap-2 mt-4">
                                        <button onClick={() => setHomeMode('home')} className={`px-4 py-2 rounded-xl text-sm font-semibold border ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>Back</button>
                                        <button onClick={() => enterRoomAction(roomCode)} className={`${theme.primary} px-4 py-2 rounded-xl text-sm font-bold flex-1`}>Join Room</button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                );
            }

            // IN-ROOM VIEW
            return (
                <div className={`flex flex-col h-screen overflow-hidden pb-16 sm:pb-0 ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                    
                    {/* Top App Navbar */}
                    <div className={`flex justify-between items-center px-4 py-2.5 border-b shadow-sm shrink-0 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                        <div className="flex items-center gap-3">
                            <div>
                                <h1 className={`font-bold text-xs sm:text-sm truncate max-w-[180px] ${theme.primaryText}`}>Room: {roomCode} {roomTopic ? `(${roomTopic})` : ''}</h1>
                                <p className="text-[10px] text-gray-400">👤 {userAvatar} {username}</p>
                            </div>
                            <button onClick={() => window.location.reload()} className="bg-red-500/10 text-red-500 border border-red-300 text-[10px] px-2 py-1 rounded font-semibold hover:bg-red-500 hover:text-white transition-all">
                                Leave Room
                            </button>
                        </div>

                        {/* Desktop Section Tabs */}
                        <div className="hidden sm:flex gap-2">
                            <button onClick={() => setActiveSection('workspace')} className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'workspace' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                🖥️ Workspace
                            </button>
                            <button onClick={() => setActiveSection('chat')} className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'chat' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                💬 Chat ({activeUsers.length})
                            </button>
                            <button onClick={() => setActiveSection('todos')} className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'todos' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                ✅ Checklist
                            </button>
                            <button onClick={() => setActiveSection('tools')} className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'tools' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                🛠️ Audio & Timer
                            </button>
                        </div>

                        <div className="flex gap-2">
                            <select value={currentThemeKey} onChange={(e) => changeTheme(e.target.value)} className={`text-xs px-2 py-1 rounded border font-semibold ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}>
                                {Object.keys(THEMES).map(k => <option key={k} value={k}>{THEMES[k].name}</option>)}
                            </select>
                            <button onClick={() => setDarkMode(!darkMode)} className="text-xs px-2 py-1 rounded border border-gray-500 hover:opacity-80">
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                        </div>
                    </div>

                    {/* Content Section Panels */}
                    <div className="flex-1 overflow-y-auto p-3 flex flex-col">
                        
                        {/* 1. WORKSPACE: Notes & Whiteboard */}
                        {activeSection === 'workspace' && (
                            <div className="flex-1 flex flex-col gap-2 h-full">
                                <div className="flex justify-between items-center shrink-0">
                                    <div className="flex gap-2">
                                        <button onClick={() => setWorkspaceTab('notes')} className={`px-3 py-1 text-xs font-bold rounded ${workspaceTab === 'notes' ? theme.tabActive : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            📝 Notes
                                        </button>
                                        <button onClick={() => setWorkspaceTab('whiteboard')} className={`px-3 py-1 text-xs font-bold rounded ${workspaceTab === 'whiteboard' ? theme.tabActive : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            🎨 Whiteboard
                                        </button>
                                    </div>

                                    {workspaceTab === 'whiteboard' && (
                                        <div className="flex items-center gap-1.5">
                                            <input type="color" value={brushColor} onChange={(e) => setBrushColor(e.target.value)} className="w-5 h-5 rounded border cursor-pointer" />
                                            <select value={brushSize} onChange={(e) => setBrushSize(Number(e.target.value))} className={`text-[11px] p-0.5 rounded ${darkMode ? 'bg-gray-800 text-white' : 'bg-white border'}`}>
                                                <option value={2}>Thin</option>
                                                <option value={4}>Med</option>
                                                <option value={8}>Thick</option>
                                            </select>
                                            <button onClick={clearBoard} className="bg-red-500 text-white px-2 py-0.5 rounded text-[11px] font-semibold">Clear</button>
                                        </div>
                                    )}
                                </div>

                                <div className={`flex-1 flex flex-col p-3 rounded-lg shadow-sm relative overflow-hidden min-h-[300px] ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    {workspaceTab === 'notes' ? (
                                        <textarea
                                            value={noteText}
                                            onChange={handleNoteChange}
                                            placeholder="Type shared real-time room notes here..."
                                            className={`flex-1 border p-3 rounded resize-none focus:outline-none text-sm min-h-[250px] ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-white border-gray-200 text-black'}`}
                                        />
                                    ) : (
                                        <div className="flex-1 w-full relative border rounded overflow-hidden bg-white touch-none min-h-[300px]">
                                            <canvas
                                                ref={canvasRef}
                                                width={800}
                                                height={500}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full h-full block cursor-crosshair"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 2. CHAT & MEMBERS */}
                        {activeSection === 'chat' && (
                            <div className={`flex-1 flex flex-col p-3 rounded-lg shadow-sm h-full max-w-2xl mx-auto w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <div className={`mb-2 p-2 rounded border text-[11px] shrink-0 ${darkMode ? theme.darkAccentBg : theme.accentBg}`}>
                                    <span className="font-bold">Online ({activeUsers.length}): </span>
                                    {activeUsers.map((u) => (
                                        <span key={u.id} className={`inline-block px-2 py-0.5 rounded-full text-[10px] mr-1 my-0.5 ${theme.badge}`}>{u.username}</span>
                                    ))}
                                </div>

                                <div className={`flex-1 border overflow-y-auto p-2.5 mb-2 rounded ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                                    {chatList.map((item, index) => (
                                        <div key={index} className="mb-2.5 text-xs">
                                            <span className={`font-bold ${theme.primaryText}`}>{item.username}</span> 
                                            <span className="text-[10px] text-gray-400 ml-2">{item.time}</span>
                                            {item.message ? (
                                                <p className={darkMode ? 'text-gray-200 mt-0.5' : 'text-gray-700 mt-0.5'}>{item.message}</p>
                                            ) : (
                                                <div className="mt-1">
                                                    {item.fileType && item.fileType.startsWith('image/') ? (
                                                        <div>
                                                            <img src={item.fileUrl} alt={item.fileName} className="max-w-[160px] rounded border my-1 shadow-sm" />
                                                            <a href={item.fileUrl} download={item.fileName} className={`underline text-[10px] block ${theme.primaryText}`}>Download {item.fileName}</a>
                                                        </div>
                                                    ) : (
                                                        <a href={item.fileUrl} download={item.fileName} className={`underline font-semibold flex items-center gap-1 ${theme.primaryText}`}>📎 {item.fileName}</a>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={sendMessage} className="flex flex-col gap-1.5 shrink-0">
                                    <div className="flex gap-1.5">
                                        <input type="text" value={message} placeholder="Type message..." className={`border flex-1 p-2 rounded text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`} onChange={(e) => setMessage(e.target.value)} />
                                        <button type="submit" className={`${theme.primary} px-3 py-2 rounded text-xs font-bold`}>Send</button>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <input type="file" onChange={handleFileUpload} className="text-[10px] text-gray-400 file:mr-1 file:py-0.5 file:px-1.5 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-gray-100 file:text-gray-700" />
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* 3. TODO CHECKLIST SECTION */}
                        {activeSection === 'todos' && (
                            <div className={`flex-1 flex flex-col p-4 rounded-lg shadow-sm max-w-xl mx-auto w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <h3 className={`font-bold text-sm mb-1 ${theme.primaryText}`}>✅ Session Study Checklist</h3>
                                <p className="text-[11px] text-gray-400 mb-3">Tasks save automatically to your browser storage.</p>
                                
                                <form onSubmit={addTodo} className="flex gap-2 mb-3">
                                    <input 
                                        type="text" 
                                        value={newTodoText} 
                                        onChange={(e) => setNewTodoText(e.target.value)} 
                                        placeholder="Add a new task..." 
                                        className={`border flex-1 p-2 rounded text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                    />
                                    <button type="submit" className={`${theme.primary} px-3 py-2 rounded text-xs font-bold`}>Add</button>
                                </form>

                                <div className="flex-1 overflow-y-auto flex flex-col gap-2">
                                    {todos.map((todo) => (
                                        <div key={todo.id} className={`flex items-center justify-between p-2.5 rounded border text-xs ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                                            <div className="flex items-center gap-2.5">
                                                <input 
                                                    type="checkbox" 
                                                    checked={todo.done} 
                                                    onChange={() => toggleTodo(todo.id)} 
                                                    className="w-4 h-4 accent-indigo-600 cursor-pointer"
                                                />
                                                <span className={`${todo.done ? 'line-through text-gray-400' : darkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                                                    {todo.text}
                                                </span>
                                            </div>
                                            <button onClick={() => deleteTodo(todo.id)} className="text-red-400 hover:text-red-600 text-xs font-bold px-1">✕</button>
                                        </div>
                                    ))}
                                    {todos.length === 0 && <p className="text-xs text-gray-400 text-center py-4">No active tasks. Add one above!</p>}
                                </div>
                            </div>
                        )}

                        {/* 4. TOOLS: Voice & Ambient Sound & Timer */}
                        {activeSection === 'tools' && (
                            <div className="flex-1 flex flex-col gap-3 max-w-xl mx-auto w-full overflow-y-auto">
                                
                                {/* Voice Chat Card */}
                                <div className={`p-4 rounded-lg shadow-sm border ${darkMode ? 'bg-gray-800 border-purple-900' : 'bg-purple-50 border-purple-200'}`}>
                                    <h3 className={`font-bold text-sm mb-1 ${darkMode ? 'text-purple-300' : 'text-purple-800'}`}>🎙️ Voice Chat</h3>
                                    <p className="text-[11px] text-gray-400 mb-3">{isInVoice ? 'Connected to voice' : 'Disconnected'}</p>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={toggleVoiceChat} className={`px-3 py-1.5 rounded text-xs font-semibold text-white ${isInVoice ? 'bg-red-500 hover:bg-red-600' : 'bg-purple-600 hover:bg-purple-700'}`}>
                                            {isInVoice ? 'Leave Voice' : 'Join Voice'}
                                        </button>
                                        {isInVoice && (
                                            <button onClick={toggleMute} className={`px-3 py-1.5 rounded text-xs font-semibold text-white ${isMuted ? 'bg-amber-600' : 'bg-gray-600'}`}>
                                                {isMuted ? 'Unmute' : 'Mute'}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Ambient Sound Generator Card */}
                                <div className={`p-4 rounded-lg shadow-sm border ${darkMode ? 'bg-gray-800 border-opacity-50' : 'bg-gray-50 border-gray-200'}`}>
                                    <h3 className={`font-bold text-sm mb-1 ${theme.primaryText}`}>🎧 Ambient Background Sounds</h3>
                                    <p className="text-[11px] text-gray-400 mb-3">Synthesizes calm concentration sounds inside your browser.</p>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={() => playAmbientSound('rain')} className={`px-3 py-1.5 rounded text-xs font-bold ${activeSound === 'rain' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-white border text-gray-700'}`}>
                                            🌧️ Soft Rain
                                        </button>
                                        <button onClick={() => playAmbientSound('brownnoise')} className={`px-3 py-1.5 rounded text-xs font-bold ${activeSound === 'brownnoise' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-white border text-gray-700'}`}>
                                            ☕ Deep Focus Hum
                                        </button>
                                        <button onClick={() => playAmbientSound('whitenoise')} className={`px-3 py-1.5 rounded text-xs font-bold ${activeSound === 'whitenoise' ? theme.tabActive : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-white border text-gray-700'}`}>
                                            🌊 White Noise
                                        </button>
                                        {activeSound !== 'none' && (
                                            <button onClick={stopAmbientSound} className="px-3 py-1.5 rounded text-xs font-bold bg-red-500 text-white">
                                                Stop Audio
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Timer Card */}
                                <div className={`p-4 rounded-lg shadow-sm flex items-center justify-between ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <div>
                                        <h3 className={`font-bold text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>⏱️ Study Timer</h3>
                                        <div className={`text-3xl font-extrabold mt-1 ${theme.primaryText}`}>{formatTime(timeLeft)}</div>
                                    </div>
                                    <div className="flex gap-1.5">
                                        <button onClick={() => socket.emit('start_timer', roomCode)} className="bg-green-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Start</button>
                                        <button onClick={() => socket.emit('pause_timer', roomCode)} className="bg-yellow-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Pause</button>
                                        <button onClick={() => socket.emit('reset_timer', roomCode)} className="bg-red-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Reset</button>
                                    </div>
                                </div>

                            </div>
                        )}

                    </div>

                    {/* Mobile Navigation Footer Bar */}
                    <div className={`sm:hidden fixed bottom-0 left-0 right-0 h-16 border-t flex justify-around items-center px-1 z-50 shadow-lg ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                        <button onClick={() => setActiveSection('workspace')} className={`flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-bold ${activeSection === 'workspace' ? theme.primaryText : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-base">🖥️</span><span>Workspace</span>
                        </button>
                        <button onClick={() => setActiveSection('chat')} className={`flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-bold ${activeSection === 'chat' ? theme.primaryText : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-base">💬</span><span>Chat</span>
                        </button>
                        <button onClick={() => setActiveSection('todos')} className={`flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-bold ${activeSection === 'todos' ? theme.primaryText : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-base">✅</span><span>Tasks</span>
                        </button>
                        <button onClick={() => setActiveSection('tools')} className={`flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-bold ${activeSection === 'tools' ? theme.primaryText : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-base">🛠️</span><span>Tools</span>
                        </button>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
