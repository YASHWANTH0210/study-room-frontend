<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Study Room</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const socket = io('https://study-room-backend-syn8.onrender.com');

        function App() {
            const [username, setUsername] = React.useState('');
            const [roomCode, setRoomCode] = React.useState('');
            const [isInRoom, setIsInRoom] = React.useState(false);
            const [message, setMessage] = React.useState('');
            const [chatList, setChatList] = React.useState([]);
            const [noteText, setNoteText] = React.useState('');
            const [timeLeft, setTimeLeft] = React.useState(1500);

            React.useEffect(() => {
                socket.on('receive_message', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_note', (data) => {
                    setNoteText(data);
                });

                socket.on('load_note', (data) => {
                    setNoteText(data);
                });

                socket.on('timer_update', (time) => {
                    setTimeLeft(time);
                });
            }, []);

            const joinRoom = () => {
                if (username !== '' && roomCode !== '') {
                    socket.emit('join_room', { username, roomCode });
                    setIsInRoom(true);
                }
            };

            const sendMessage = (e) => {
                e.preventDefault();
                if (message !== '') {
                    const messageData = {
                        roomCode,
                        username,
                        message,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_message', messageData);
                    setChatList((list) => [...list, messageData]);
                    setMessage('');
                }
            };

            const handleNoteChange = (e) => {
                const text = e.target.value;
                setNoteText(text);
                socket.emit('update_note', { roomCode, text });
            };

            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            if (!isInRoom) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen">
                        <div className="bg-white p-8 rounded-lg shadow-md text-center">
                            <h2 className="text-2xl font-bold mb-4 text-blue-600">Join a Study Room</h2>
                            <input
                                type="text"
                                placeholder="Your Name..."
                                className="border p-2 mb-3 w-full rounded"
                                onChange={(e) => setUsername(e.target.value)}
                            /><br/>
                            <input
                                type="text"
                                placeholder="Room Code (e.g. 123)..."
                                className="border p-2 mb-4 w-full rounded"
                                onChange={(e) => setRoomCode(e.target.value)}
                            /><br/>
                            <button 
                                onClick={joinRoom} 
                                className="bg-blue-500 text-white px-4 py-2 rounded w-full hover:bg-blue-600">
                                Join Room
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen">
                    {/* Left Column: Chat */}
                    <div className="w-1/3 border-r border-gray-300 flex flex-col p-4 bg-white">
                        <h3 className="font-bold text-lg mb-2">Room: {roomCode} | User: {username}</h3>
                        <div className="flex-1 border border-gray-200 overflow-y-auto p-3 mb-3 rounded bg-gray-50">
                            {chatList.map((item, index) => (
                                <div key={index} className="mb-2">
                                    <span className="font-bold text-blue-600">{item.username}</span> 
                                    <span className="text-xs text-gray-400 ml-2">{item.time}</span>
                                    <p className="text-gray-700">{item.message}</p>
                                </div>
                            ))}
                        </div>
                        <form onSubmit={sendMessage} className="flex gap-2">
                            <input
                                type="text"
                                value={message}
                                placeholder="Type a message..."
                                className="border flex-1 p-2 rounded"
                                onChange={(e) => setMessage(e.target.value)}
                            />
                            <button type="submit" className="bg-blue-500 text-white px-4 py-2 rounded">Send</button>
                        </form>
                    </div>

                    {/* Right Column: Timer & Shared Notes */}
                    <div className="flex-1 flex flex-col p-4 bg-gray-50 gap-4">
                        {/* Pomodoro Timer Widget */}
                        <div className="bg-white p-4 rounded-lg shadow-md flex items-center justify-between">
                            <div>
                                <h3 className="font-bold text-md text-gray-700">Study Timer (Pomodoro)</h3>
                                <div className="text-3xl font-extrabold text-blue-600 mt-1">{formatTime(timeLeft)}</div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => socket.emit('start_timer', roomCode)} className="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600">Start</button>
                                <button onClick={() => socket.emit('pause_timer', roomCode)} className="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600">Pause</button>
                                <button onClick={() => socket.emit('reset_timer', roomCode)} className="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Reset</button>
                            </div>
                        </div>

                        {/* Shared Workspace */}
                        <div className="flex-1 flex flex-col bg-white p-4 rounded-lg shadow-md">
                            <h3 className="font-bold text-lg mb-2">Shared Workspace / Notes</h3>
                            <textarea
                                value={noteText}
                                onChange={handleNoteChange}
                                placeholder="Type notes here. Everyone in room will see live updates!"
                                className="flex-1 border p-4 rounded resize-none focus:outline-none"
                            />
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
