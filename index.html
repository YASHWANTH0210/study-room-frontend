<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Study Room</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const socket = io('https://study-room-backend-syn8.onrender.com');

        function App() {
            const [username, setUsername] = React.useState('');
            const [roomCode, setRoomCode] = React.useState('');
            const [roomPassword, setRoomPassword] = React.useState('');
            const [errorMessage, setErrorMessage] = React.useState('');
            const [isInRoom, setIsInRoom] = React.useState(false);
            const [message, setMessage] = React.useState('');
            const [chatList, setChatList] = React.useState([]);
            const [noteText, setNoteText] = React.useState('');
            const [timeLeft, setTimeLeft] = React.useState(1500);
            const [darkMode, setDarkMode] = React.useState(false);
            const [activeUsers, setActiveUsers] = React.useState([]);
            
            const [isMobile, setIsMobile] = React.useState(false);

            React.useEffect(() => {
                const checkMobile = () => {
                    const mobileCheck = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    setIsMobile(mobileCheck);
                };
                checkMobile();
            }, []);
            
            // Section Navigation State ('workspace', 'chat', 'tools')
            const [activeSection, setActiveSection] = React.useState('workspace');
            const [workspaceTab, setWorkspaceTab] = React.useState('notes');

            // Voice Chat States
            const [isInVoice, setIsInVoice] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const localStreamRef = React.useRef(null);
            const peersRef = React.useRef([]);

            // Screen Sharing States
            const [isSharingScreen, setIsSharingScreen] = React.useState(false);
            const screenStreamRef = React.useRef(null);
            const screenPeersRef = React.useRef([]);
            const [remoteScreenStreams, setRemoteScreenStreams] = React.useState([]);

            // Whiteboard States & Refs
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [brushColor, setBrushColor] = React.useState('#3b82f6');
            const [brushSize, setBrushSize] = React.useState(3);
            const lastPosRef = React.useRef({ x: 0, y: 0 });

            React.useEffect(() => {
                socket.on('receive_message', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_file', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_note', (data) => {
                    setNoteText(data);
                });

                socket.on('load_note', (data) => {
                    setNoteText(data);
                });

                socket.on('timer_update', (time) => {
                    setTimeLeft(time);
                });

                socket.on('update_users', (users) => {
                    setActiveUsers(users);
                });

                socket.on('auth_success', () => {
                    setIsInRoom(true);
                    setErrorMessage('');
                });

                socket.on('auth_error', (msg) => {
                    setErrorMessage(msg);
                });

                socket.on('receive_drawing', (data) => {
                    drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size, false);
                });

                socket.on('clear_board', () => {
                    clearCanvasLocally();
                });
            }, []);

            // Screen Sharing Logic
            const toggleScreenShare = async () => {
                if (isMobile) {
                    alert('Mobile browsers restrict screen sharing.');
                    return;
                }

                if (!isSharingScreen) {
                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        screenStreamRef.current = stream;
                        setIsSharingScreen(true);
                        socket.emit('join_screen', roomCode);

                        stream.getVideoTracks()[0].onended = () => {
                            stopScreenShare();
                        };

                        socket.on('user_joined_screen', (incomingId) => {
                            const peer = createScreenPeer(incomingId, stream);
                            screenPeersRef.current.push({ peerId: incomingId, peer });
                        });

                        socket.on('screen_signal', (data) => {
                            const item = screenPeersRef.current.find(p => p.peerId === data.from);
                            if (item) {
                                item.peer.signal(data.signal);
                            } else {
                                const peer = addScreenPeer(data.signal, data.from, stream);
                                screenPeersRef.current.push({ peerId: data.from, peer });
                            }
                        });

                        socket.on('user_left_screen', (id) => {
                            const item = screenPeersRef.current.find(p => p.peerId === id);
                            if (item) {
                                item.peer.destroy();
                                screenPeersRef.current = screenPeersRef.current.filter(p => p.peerId !== id);
                            }
                            setRemoteScreenStreams(prev => prev.filter(s => s.id !== id));
                        });
                    } catch (err) {
                        console.error('Error sharing screen:', err);
                    }
                } else {
                    stopScreenShare();
                }
            };

            const stopScreenShare = () => {
                if (screenStreamRef.current) {
                    screenStreamRef.current.getTracks().forEach(track => track.stop());
                }
                screenPeersRef.current.forEach(p => p.peer.destroy());
                screenPeersRef.current = [];
                setIsSharingScreen(false);
                socket.emit('leave_screen', roomCode);
            };

            const createScreenPeer = (userToSignal, stream) => {
                const peer = new SimplePeer({
                    initiator: true,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('screen_signal', { to: userToSignal, signal });
                });

                peer.on('stream', (remoteStream) => {
                    setRemoteScreenStreams(prev => {
                        if (!prev.some(s => s.id === userToSignal)) {
                            return [...prev, { id: userToSignal, stream: remoteStream }];
                        }
                        return prev;
                    });
                });

                return peer;
            };

            const addScreenPeer = (incomingSignal, callerId, stream) => {
                const peer = new SimplePeer({
                    initiator: false,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('screen_signal', { to: callerId, signal });
                });

                peer.on('stream', (remoteStream) => {
                    setRemoteScreenStreams(prev => {
                        if (!prev.some(s => s.id === callerId)) {
                            return [...prev, { id: callerId, stream: remoteStream }];
                        }
                        return prev;
                    });
                });

                peer.signal(incomingSignal);
                return peer;
            };

            // Whiteboard Drawing Logic
            const getPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                lastPosRef.current = getPos(e);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                drawLine(lastPosRef.current.x, lastPosRef.current.y, pos.x, pos.y, brushColor, brushSize, true);
                lastPosRef.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const drawLine = (x0, y0, x1, y1, color, size, emit) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.closePath();

                if (emit) {
                    socket.emit('drawing', { roomCode, x0, y0, x1, y1, color, size });
                }
            };

            const clearCanvasLocally = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const clearBoard = () => {
                clearCanvasLocally();
                socket.emit('clear_board', roomCode);
            };

            // Voice Chat Logic
            const toggleVoiceChat = async () => {
                if (!isInVoice) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        localStreamRef.current = stream;
                        setIsInVoice(true);
                        socket.emit('join_voice', roomCode);

                        socket.on('user_joined_voice', (incomingId) => {
                            const peer = createPeer(incomingId, stream);
                            peersRef.current.push({ peerId: incomingId, peer });
                        });

                        socket.on('signal', (data) => {
                            const item = peersRef.current.find(p => p.peerId === data.from);
                            if (item) {
                                item.peer.signal(data.signal);
                            } else {
                                const peer = addPeer(data.signal, data.from, stream);
                                peersRef.current.push({ peerId: data.from, peer });
                            }
                        });

                        socket.on('user_left_voice', (id) => {
                            const item = peersRef.current.find(p => p.peerId === id);
                            if (item) {
                                item.peer.destroy();
                                peersRef.current = peersRef.current.filter(p => p.peerId !== id);
                            }
                        });
                    } catch (err) {
                        alert('Could not access microphone. Check browser permissions.');
                    }
                } else {
                    if (localStreamRef.current) {
                        localStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                    peersRef.current.forEach(p => p.peer.destroy());
                    peersRef.current = [];
                    setIsInVoice(false);
                    socket.emit('leave_voice', roomCode);
                }
            };

            const createPeer = (userToSignal, stream) => {
                const peer = new SimplePeer({
                    initiator: true,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('signal', { to: userToSignal, signal });
                });

                peer.on('stream', (remoteStream) => {
                    playRemoteAudio(remoteStream);
                });

                return peer;
            };

            const addPeer = (incomingSignal, callerId, stream) => {
                const peer = new SimplePeer({
                    initiator: false,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('signal', { to: callerId, signal });
                });

                peer.on('stream', (remoteStream) => {
                    playRemoteAudio(remoteStream);
                });

                peer.signal(incomingSignal);
                return peer;
            };

            const playRemoteAudio = (stream) => {
                const audio = document.createElement('audio');
                audio.srcObject = stream;
                audio.autoplay = true;
                document.body.appendChild(audio);
            };

            const toggleMute = () => {
                if (localStreamRef.current) {
                    const audioTrack = localStreamRef.current.getAudioTracks()[0];
                    audioTrack.enabled = !audioTrack.enabled;
                    setIsMuted(!isMuted);
                }
            };

            const joinRoom = () => {
                if (username !== '' && roomCode !== '') {
                    socket.emit('join_room', { username, roomCode, password: roomPassword });
                } else {
                    setErrorMessage('Please fill in your name and room code.');
                }
            };

            const sendMessage = (e) => {
                e.preventDefault();
                if (message !== '') {
                    const messageData = {
                        roomCode,
                        username,
                        message,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_message', messageData);
                    setChatList((list) => [...list, messageData]);
                    setMessage('');
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    const fileData = {
                        roomCode,
                        username,
                        fileName: file.name,
                        fileType: file.type,
                        fileUrl: reader.result,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_file', fileData);
                    setChatList((list) => [...list, fileData]);
                };
                reader.readAsDataURL(file);
            };

            const handleNoteChange = (e) => {
                const text = e.target.value;
                setNoteText(text);
                socket.emit('update_note', { roomCode, text });
            };

            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            if (!isInRoom) {
                return (
                    <div className={`flex flex-col items-center justify-center h-screen px-4 ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                        <div className={`p-8 rounded-lg shadow-md text-center w-full max-w-sm ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold text-blue-500">Join Room</h2>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="text-xs px-2 py-1 rounded border border-gray-500 hover:bg-gray-700">
                                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>

                            {errorMessage && (
                                <div className="mb-3 p-2 bg-red-100 text-red-700 text-xs rounded border border-red-300">
                                    {errorMessage}
                                </div>
                            )}

                            <input
                                type="text"
                                placeholder="Your Name..."
                                className={`border p-2 mb-3 w-full rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setUsername(e.target.value)}
                            /><br/>
                            <input
                                type="text"
                                placeholder="Room Code (e.g. 123)..."
                                className={`border p-2 mb-3 w-full rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setRoomCode(e.target.value)}
                            /><br/>
                            <input
                                type="password"
                                placeholder="Room Password (Optional)..."
                                className={`border p-2 mb-4 w-full rounded ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                onChange={(e) => setRoomPassword(e.target.value)}
                            /><br/>
                            <button 
                                onClick={joinRoom} 
                                className="bg-blue-500 text-white px-4 py-2 rounded w-full hover:bg-blue-600 font-semibold">
                                Enter Study Room
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-screen overflow-hidden ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                    
                    {/* Top Header Navigation Bar */}
                    <div className={`flex justify-between items-center px-4 py-3 border-b shadow-sm ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                        <div>
                            <h1 className="font-bold text-md text-blue-500">📚 Study Room: {roomCode}</h1>
                            <p className="text-[11px] text-gray-400">User: {username}</p>
                        </div>

                        {/* Main Section Toggles */}
                        <div className="flex gap-1 sm:gap-2">
                            <button 
                                onClick={() => setActiveSection('workspace')} 
                                className={`px-3 py-1.5 rounded text-xs sm:text-sm font-bold transition-all ${activeSection === 'workspace' ? 'bg-blue-600 text-white shadow' : darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                🖥️ Workspace
                            </button>
                            <button 
                                onClick={() => setActiveSection('chat')} 
                                className={`px-3 py-1.5 rounded text-xs sm:text-sm font-bold transition-all ${activeSection === 'chat' ? 'bg-blue-600 text-white shadow' : darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                💬 Chat & Members ({activeUsers.length})
                            </button>
                            <button 
                                onClick={() => setActiveSection('tools')} 
                                className={`px-3 py-1.5 rounded text-xs sm:text-sm font-bold transition-all ${activeSection === 'tools' ? 'bg-blue-600 text-white shadow' : darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                🛠️ Voice & Timer
                            </button>
                        </div>

                        <button 
                            onClick={() => setDarkMode(!darkMode)}
                            className="text-xs px-2.5 py-1.5 rounded border border-gray-500 hover:opacity-80">
                            {darkMode ? '☀️' : '🌙'}
                        </button>
                    </div>

                    {/* Main Content Sections */}
                    <div className="flex-1 overflow-y-auto p-4 flex flex-col">
                        
                        {/* SECTION 1: WORKSPACE (Notes & Whiteboard & Screen Shares) */}
                        {activeSection === 'workspace' && (
                            <div className="flex-1 flex flex-col gap-3 h-full">
                                {/* Remote Screen Share Streams (PC only) */}
                                {remoteScreenStreams.length > 0 && !isMobile && (
                                    <div className="hidden lg:flex flex-col gap-2 p-2 bg-black rounded-lg border border-gray-700">
                                        <span className="text-xs text-white font-bold px-1">🖥️ Shared Screens ({remoteScreenStreams.length}):</span>
                                        {remoteScreenStreams.map((item, idx) => (
                                            <div key={idx} className="relative w-full bg-gray-950 rounded overflow-hidden border border-gray-800" style={{ minHeight: '200px' }}>
                                                <video
                                                    autoPlay
                                                    playsInline
                                                    muted={false}
                                                    ref={(vid) => { 
                                                        if (vid && vid.srcObject !== item.stream) { 
                                                            vid.srcObject = item.stream; 
                                                            vid.play().catch(e => console.log("Autoplay waiting for interaction:", e));
                                                        } 
                                                    }}
                                                    className="w-full h-auto max-h-[250px] object-contain block mx-auto"
                                                />
                                                <span className="absolute bottom-2 left-2 bg-black/80 text-white text-[10px] px-2 py-0.5 rounded">
                                                    Stream ID: {item.id.slice(0, 5)}...
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Sub-Tabs for Workspace (Notes vs Whiteboard) */}
                                <div className="flex justify-between items-center">
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setWorkspaceTab('notes')} 
                                            className={`px-3 py-1 text-xs sm:text-sm font-bold rounded ${workspaceTab === 'notes' ? 'bg-blue-500 text-white' : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            📝 Shared Notes
                                        </button>
                                        <button 
                                            onClick={() => setWorkspaceTab('whiteboard')} 
                                            className={`px-3 py-1 text-xs sm:text-sm font-bold rounded ${workspaceTab === 'whiteboard' ? 'bg-blue-500 text-white' : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            🎨 Whiteboard
                                        </button>
                                    </div>

                                    {workspaceTab === 'whiteboard' && (
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <input 
                                                type="color" 
                                                value={brushColor} 
                                                onChange={(e) => setBrushColor(e.target.value)}
                                                className="w-6 h-6 rounded border cursor-pointer"
                                            />
                                            <select 
                                                value={brushSize} 
                                                onChange={(e) => setBrushSize(Number(e.target.value))}
                                                className={`text-xs p-1 rounded ${darkMode ? 'bg-gray-800 text-white' : 'bg-white border'}`}>
                                                <option value={2}>Thin</option>
                                                <option value={4}>Med</option>
                                                <option value={8}>Thick</option>
                                            </select>
                                            <button 
                                                onClick={clearBoard} 
                                                className="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600 font-semibold">
                                                Clear
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* Workspace Box */}
                                <div className={`flex-1 flex flex-col p-4 rounded-lg shadow-md relative overflow-hidden min-h-[400px] ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    {workspaceTab === 'notes' ? (
                                        <textarea
                                            value={noteText}
                                            onChange={handleNoteChange}
                                            placeholder="Type notes here. Everyone in the room sees live updates!"
                                            className={`flex-1 border p-4 rounded resize-none focus:outline-none min-h-[350px] ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-white border-gray-200 text-black'}`}
                                        />
                                    ) : (
                                        <div className="flex-1 w-full h-[400px] relative border rounded overflow-hidden bg-white touch-none">
                                            <canvas
                                                ref={canvasRef}
                                                width={900}
                                                height={600}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full h-full block cursor-crosshair"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* SECTION 2: CHAT & MEMBERS */}
                        {activeSection === 'chat' && (
                            <div className={`flex-1 flex flex-col p-4 rounded-lg shadow-md h-full max-w-3xl mx-auto w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <h3 className="font-bold text-md mb-2">💬 Room Chat & Active Members</h3>
                                
                                {/* Active Users Chips */}
                                <div className={`mb-3 p-2 rounded border text-xs ${darkMode ? 'bg-gray-900 border-gray-700 text-gray-300' : 'bg-blue-50 border-blue-100 text-blue-800'}`}>
                                    <span className="font-bold">Online Now ({activeUsers.length}): </span>
                                    {activeUsers.map((u) => (
                                        <span key={u.id} className="inline-block bg-blue-500 text-white px-2 py-0.5 rounded-full text-[10px] mr-1 my-0.5">
                                            {u.username}
                                        </span>
                                    ))}
                                </div>

                                {/* Messages Box */}
                                <div className={`flex-1 border overflow-y-auto p-3 mb-3 rounded ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                                    {chatList.map((item, index) => (
                                        <div key={index} className="mb-3">
                                            <span className="font-bold text-blue-400">{item.username}</span> 
                                            <span className="text-xs text-gray-400 ml-2">{item.time}</span>
                                            {item.message ? (
                                                <p className={darkMode ? 'text-gray-200 mt-0.5' : 'text-gray-700 mt-0.5'}>{item.message}</p>
                                            ) : (
                                                <div className="mt-1">
                                                    {item.fileType && item.fileType.startsWith('image/') ? (
                                                        <div>
                                                            <img src={item.fileUrl} alt={item.fileName} className="max-w-[200px] rounded border my-1 shadow-sm" />
                                                            <a href={item.fileUrl} download={item.fileName} className="text-blue-400 underline text-[10px] block">
                                                                Download {item.fileName}
                                                            </a>
                                                        </div>
                                                    ) : (
                                                        <a href={item.fileUrl} download={item.fileName} className="text-blue-500 underline text-xs font-semibold flex items-center gap-1">
                                                            📎 {item.fileName} (Download)
                                                        </a>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {/* Message Input Form */}
                                <form onSubmit={sendMessage} className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={message}
                                            placeholder="Type a message to the room..."
                                            className={`border flex-1 p-2.5 rounded text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                            onChange={(e) => setMessage(e.target.value)}
                                        />
                                        <button type="submit" className="bg-blue-500 text-white px-4 py-2.5 rounded text-sm hover:bg-blue-600 font-bold">Send</button>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-xs text-gray-400">Attach file/image:</label>
                                        <input 
                                            type="file" 
                                            onChange={handleFileUpload}
                                            className="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                                        />
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* SECTION 3: TOOLS (Voice Chat, Screen Sharing & Timer) */}
                        {activeSection === 'tools' && (
                            <div className="flex-1 flex flex-col gap-4 max-w-2xl mx-auto w-full">
                                
                                {/* Voice Chat & Screen Share Widget */}
                                <div className={`p-5 rounded-lg shadow-md border ${darkMode ? 'bg-gray-800 border-purple-900' : 'bg-purple-50 border-purple-200'}`}>
                                    <h3 className={`font-bold text-md mb-1 ${darkMode ? 'text-purple-300' : 'text-purple-800'}`}>🎙️ Voice Chat & Screen Sharing</h3>
                                    <p className="text-xs text-gray-400 mb-4">
                                        {isInVoice ? 'Connected to voice room' : 'Not connected to voice'}
                                    </p>
                                    <div className="flex flex-wrap gap-3">
                                        <button 
                                            onClick={toggleVoiceChat} 
                                            className={`px-4 py-2 rounded text-sm font-semibold text-white ${isInVoice ? 'bg-red-500 hover:bg-red-600' : 'bg-purple-600 hover:bg-purple-700'}`}>
                                            {isInVoice ? 'Leave Voice Chat' : 'Join Voice Chat'}
                                        </button>
                                        {isInVoice && (
                                            <button 
                                                onClick={toggleMute} 
                                                className={`px-4 py-2 rounded text-sm font-semibold text-white ${isMuted ? 'bg-amber-600 hover:bg-amber-700' : 'bg-gray-600 hover:bg-gray-700'}`}>
                                                {isMuted ? 'Unmute Microphone' : 'Mute Microphone'}
                                            </button>
                                        )}
                                        {!isMobile && (
                                            <button 
                                                onClick={toggleScreenShare} 
                                                className={`px-4 py-2 rounded text-sm font-semibold text-white ${isSharingScreen ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                                {isSharingScreen ? 'Stop Screen Sharing' : 'Share Screen (PC Only)'}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Pomodoro Timer Widget */}
                                <div className={`p-5 rounded-lg shadow-md flex items-center justify-between ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <div>
                                        <h3 className={`font-bold text-lg ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>⏱️ Study Timer</h3>
                                        <div className="text-4xl font-extrabold text-blue-400 mt-2">{formatTime(timeLeft)}</div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => socket.emit('start_timer', roomCode)} className="bg-green-600 text-white px-3 py-2 rounded text-sm hover:bg-green-700 font-bold">Start</button>
                                        <button onClick={() => socket.emit('pause_timer', roomCode)} className="bg-yellow-600 text-white px-3 py-2 rounded text-sm hover:bg-yellow-700 font-bold">Pause</button>
                                        <button onClick={() => socket.emit('reset_timer', roomCode)} className="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700 font-bold">Reset</button>
                                    </div>
                                </div>

                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
