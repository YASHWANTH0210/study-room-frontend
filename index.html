<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Study Room</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const socket = io('https://study-room-backend-syn8.onrender.com');

        function App() {
            const [username, setUsername] = React.useState('');
            const [roomCode, setRoomCode] = React.useState('');
            const [roomPassword, setRoomPassword] = React.useState('');
            
            // New Room Creation Customization States
            const [roomDuration, setRoomDuration] = React.useState('60'); // default 60 mins
            const [roomTopic, setRoomTopic] = React.useState('');
            const [roomRules, setRoomRules] = React.useState('');

            const [errorMessage, setErrorMessage] = React.useState('');
            const [isInRoom, setIsInRoom] = React.useState(false);
            
            // Home page mode state: 'home', 'join', or 'create'
            const [homeMode, setHomeMode] = React.useState('home');

            const [message, setMessage] = React.useState('');
            const [chatList, setChatList] = React.useState([]);
            const [noteText, setNoteText] = React.useState('');
            const [timeLeft, setTimeLeft] = React.useState(1500);
            const [darkMode, setDarkMode] = React.useState(false);
            const [activeUsers, setActiveUsers] = React.useState([]);
            
            const [isMobile, setIsMobile] = React.useState(false);

            React.useEffect(() => {
                const checkMobile = () => {
                    const mobileCheck = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    setIsMobile(mobileCheck);
                };
                checkMobile();
            }, []);
            
            const [activeSection, setActiveSection] = React.useState('workspace');
            const [workspaceTab, setWorkspaceTab] = React.useState('notes');

            // Voice Chat States
            const [isInVoice, setIsInVoice] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const localStreamRef = React.useRef(null);
            const peersRef = React.useRef([]);

            // Screen Sharing States
            const [isSharingScreen, setIsSharingScreen] = React.useState(false);
            const screenStreamRef = React.useRef(null);
            const screenPeersRef = React.useRef([]);
            const [remoteScreenStreams, setRemoteScreenStreams] = React.useState([]);

            // Whiteboard States & Refs
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [brushColor, setBrushColor] = React.useState('#3b82f6');
            const [brushSize, setBrushSize] = React.useState(3);
            const lastPosRef = React.useRef({ x: 0, y: 0 });

            React.useEffect(() => {
                socket.on('receive_message', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_file', (data) => {
                    setChatList((list) => [...list, data]);
                });

                socket.on('receive_note', (data) => {
                    setNoteText(data);
                });

                socket.on('load_note', (data) => {
                    setNoteText(data);
                });

                socket.on('timer_update', (time) => {
                    setTimeLeft(time);
                });

                socket.on('update_users', (users) => {
                    setActiveUsers(users);
                });

                socket.on('auth_success', () => {
                    setIsInRoom(true);
                    setErrorMessage('');
                });

                socket.on('auth_error', (msg) => {
                    setErrorMessage(msg);
                });

                socket.on('receive_drawing', (data) => {
                    drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size, false);
                });

                socket.on('clear_board', () => {
                    clearCanvasLocally();
                });
            }, []);

            // Generate a random room code for creating a room
            const generateRoomCode = () => {
                const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
                setRoomCode(randomCode);
            };

            // Screen Sharing Logic
            const toggleScreenShare = async () => {
                if (isMobile) {
                    alert('Mobile browsers restrict screen sharing.');
                    return;
                }

                if (!isSharingScreen) {
                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        screenStreamRef.current = stream;
                        setIsSharingScreen(true);
                        socket.emit('join_screen', roomCode);

                        stream.getVideoTracks()[0].onended = () => {
                            stopScreenShare();
                        };

                        socket.on('user_joined_screen', (incomingId) => {
                            const peer = createScreenPeer(incomingId, stream);
                            screenPeersRef.current.push({ peerId: incomingId, peer });
                        });

                        socket.on('screen_signal', (data) => {
                            const item = screenPeersRef.current.find(p => p.peerId === data.from);
                            if (item) {
                                item.peer.signal(data.signal);
                            } else {
                                const peer = addScreenPeer(data.signal, data.from, stream);
                                screenPeersRef.current.push({ peerId: data.from, peer });
                            }
                        });

                        socket.on('user_left_screen', (id) => {
                            const item = screenPeersRef.current.find(p => p.peerId === id);
                            if (item) {
                                item.peer.destroy();
                                screenPeersRef.current = screenPeersRef.current.filter(p => p.peerId !== id);
                            }
                            setRemoteScreenStreams(prev => prev.filter(s => s.id !== id));
                        });
                    } catch (err) {
                        console.error('Error sharing screen:', err);
                    }
                } else {
                    stopScreenShare();
                }
            };

            const stopScreenShare = () => {
                if (screenStreamRef.current) {
                    screenStreamRef.current.getTracks().forEach(track => track.stop());
                }
                screenPeersRef.current.forEach(p => p.peer.destroy());
                screenPeersRef.current = [];
                setIsSharingScreen(false);
                socket.emit('leave_screen', roomCode);
            };

            const createScreenPeer = (userToSignal, stream) => {
                const peer = new SimplePeer({
                    initiator: true,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('screen_signal', { to: userToSignal, signal });
                });

                peer.on('stream', (remoteStream) => {
                    setRemoteScreenStreams(prev => {
                        if (!prev.some(s => s.id === userToSignal)) {
                            return [...prev, { id: userToSignal, stream: remoteStream }];
                        }
                        return prev;
                    });
                });

                return peer;
            };

            const addScreenPeer = (incomingSignal, callerId, stream) => {
                const peer = new SimplePeer({
                    initiator: false,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('screen_signal', { to: callerId, signal });
                });

                peer.on('stream', (remoteStream) => {
                    setRemoteScreenStreams(prev => {
                        if (!prev.some(s => s.id === callerId)) {
                            return [...prev, { id: callerId, stream: remoteStream }];
                        }
                        return prev;
                    });
                });

                peer.signal(incomingSignal);
                return peer;
            };

            // Whiteboard Drawing Logic
            const getPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                lastPosRef.current = getPos(e);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                drawLine(lastPosRef.current.x, lastPosRef.current.y, pos.x, pos.y, brushColor, brushSize, true);
                lastPosRef.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const drawLine = (x0, y0, x1, y1, color, size, emit) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.closePath();

                if (emit) {
                    socket.emit('drawing', { roomCode, x0, y0, x1, y1, color, size });
                }
            };

            const clearCanvasLocally = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const clearBoard = () => {
                clearCanvasLocally();
                socket.emit('clear_board', roomCode);
            };

            // Voice Chat Logic
            const toggleVoiceChat = async () => {
                if (!isInVoice) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        localStreamRef.current = stream;
                        setIsInVoice(true);
                        socket.emit('join_voice', roomCode);

                        socket.on('user_joined_voice', (incomingId) => {
                            const peer = createPeer(incomingId, stream);
                            peersRef.current.push({ peerId: incomingId, peer });
                        });

                        socket.on('signal', (data) => {
                            const item = peersRef.current.find(p => p.peerId === data.from);
                            if (item) {
                                item.peer.signal(data.signal);
                            } else {
                                const peer = addPeer(data.signal, data.from, stream);
                                peersRef.current.push({ peerId: data.from, peer });
                            }
                        });

                        socket.on('user_left_voice', (id) => {
                            const item = peersRef.current.find(p => p.peerId === id);
                            if (item) {
                                item.peer.destroy();
                                peersRef.current = peersRef.current.filter(p => p.peerId !== id);
                            }
                        });
                    } catch (err) {
                        alert('Could not access microphone. Check browser permissions.');
                    }
                } else {
                    if (localStreamRef.current) {
                        localStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                    peersRef.current.forEach(p => p.peer.destroy());
                    peersRef.current = [];
                    setIsInVoice(false);
                    socket.emit('leave_voice', roomCode);
                }
            };

            const createPeer = (userToSignal, stream) => {
                const peer = new SimplePeer({
                    initiator: true,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('signal', { to: userToSignal, signal });
                });

                peer.on('stream', (remoteStream) => {
                    playRemoteAudio(remoteStream);
                });

                return peer;
            };

            const addPeer = (incomingSignal, callerId, stream) => {
                const peer = new SimplePeer({
                    initiator: false,
                    trickle: false,
                    stream: stream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                peer.on('signal', (signal) => {
                    socket.emit('signal', { to: callerId, signal });
                });

                peer.on('stream', (remoteStream) => {
                    playRemoteAudio(remoteStream);
                });

                peer.signal(incomingSignal);
                return peer;
            };

            const playRemoteAudio = (stream) => {
                const audio = document.createElement('audio');
                audio.srcObject = stream;
                audio.autoplay = true;
                document.body.appendChild(audio);
            };

            const toggleMute = () => {
                if (localStreamRef.current) {
                    const audioTrack = localStreamRef.current.getAudioTracks()[0];
                    audioTrack.enabled = !audioTrack.enabled;
                    setIsMuted(!isMuted);
                }
            };

            const enterRoomAction = () => {
                if (username !== '' && roomCode !== '') {
                    socket.emit('join_room', { 
                        username, 
                        roomCode, 
                        password: roomPassword,
                        duration: roomDuration,
                        topic: roomTopic,
                        rules: roomRules
                    });
                } else {
                    setErrorMessage('Please fill in your name and room code.');
                }
            };

            const sendMessage = (e) => {
                e.preventDefault();
                if (message !== '') {
                    const messageData = {
                        roomCode,
                        username,
                        message,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_message', messageData);
                    setChatList((list) => [...list, messageData]);
                    setMessage('');
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    const fileData = {
                        roomCode,
                        username,
                        fileName: file.name,
                        fileType: file.type,
                        fileUrl: reader.result,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    };
                    socket.emit('send_file', fileData);
                    setChatList((list) => [...list, fileData]);
                };
                reader.readAsDataURL(file);
            };

            const handleNoteChange = (e) => {
                const text = e.target.value;
                setNoteText(text);
                socket.emit('update_note', { roomCode, text });
            };

            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            // HOMEPAGE VIEW (When not in a room yet)
            if (!isInRoom) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen py-6 px-4 ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                        <div className={`p-6 sm:p-8 rounded-xl shadow-lg text-center w-full max-w-md ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            
                            {/* Theme Toggle Top Bar */}
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-xl font-extrabold text-blue-500">📚 Virtual Study Room</h1>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="text-xs px-2.5 py-1.5 rounded border border-gray-500 hover:opacity-80">
                                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>

                            {errorMessage && (
                                <div className="mb-4 p-2.5 bg-red-100 text-red-700 text-xs rounded border border-red-300">
                                    {errorMessage}
                                </div>
                            )}

                            {/* MAIN HOME SELECTION VIEW */}
                            {homeMode === 'home' && (
                                <div className="flex flex-col gap-4 py-4">
                                    <p className="text-sm text-gray-400 mb-2">Collaborate, share notes, draw, and study together in real-time.</p>
                                    <button 
                                        onClick={() => setHomeMode('create')} 
                                        className="bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 shadow transition-all">
                                        ✨ Create a New Room
                                    </button>
                                    <button 
                                        onClick={() => setHomeMode('join')} 
                                        className={`p-3 rounded-lg font-bold border transition-all ${darkMode ? 'border-gray-600 hover:bg-gray-700' : 'border-gray-300 hover:bg-gray-50'}`}>
                                        🚪 Join Existing Room
                                    </button>
                                </div>
                            )}

                            {/* CREATE ROOM FORM */}
                            {homeMode === 'create' && (
                                <div className="flex flex-col text-left gap-2.5 max-h-[75vh] overflow-y-auto pr-1">
                                    <h2 className="text-md font-bold text-blue-400 mb-1">✨ Create a New Study Room</h2>
                                    
                                    <label className="text-xs text-gray-400 font-semibold">Your Name:</label>
                                    <input
                                        type="text"
                                        placeholder="e.g. Alex..."
                                        className={`border p-2 rounded text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                    />

                                    <label className="text-xs text-gray-400 font-semibold">Room Code:</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="Click generate ->"
                                            className={`border p-2 rounded text-sm flex-1 font-mono ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                            value={roomCode}
                                            onChange={(e) => setRoomCode(e.target.value)}
                                        />
                                        <button 
                                            onClick={generateRoomCode}
                                            className="bg-purple-600 text-white px-3 py-2 rounded text-xs font-bold hover:bg-purple-700">
                                            Generate
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-gray-400 font-semibold block mb-1">Session Duration:</label>
                                            <select
                                                value={roomDuration}
                                                onChange={(e) => setRoomDuration(e.target.value)}
                                                className={`border p-2 rounded text-sm w-full ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}>
                                                <option value="30">30 Mins</option>
                                                <option value="60">1 Hour</option>
                                                <option value="90">1.5 Hours</option>
                                                <option value="120">2 Hours</option>
                                                <option value="0">Unlimited</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-400 font-semibold block mb-1">Room Password:</label>
                                            <input
                                                type="password"
                                                placeholder="Optional..."
                                                className={`border p-2 rounded text-sm w-full ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                                value={roomPassword}
                                                onChange={(e) => setRoomPassword(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    <label className="text-xs text-gray-400 font-semibold">Study Topic / Subject:</label>
                                    <input
                                        type="text"
                                        placeholder="e.g. Calculus Final Prep..."
                                        className={`border p-2 rounded text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={roomTopic}
                                        onChange={(e) => setRoomTopic(e.target.value)}
                                    />

                                    <label className="text-xs text-gray-400 font-semibold">Room Guidelines / Rules:</label>
                                    <textarea
                                        placeholder="e.g. Mikes muted during deep study blocks..."
                                        rows="2"
                                        className={`border p-2 rounded text-sm resize-none ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={roomRules}
                                        onChange={(e) => setRoomRules(e.target.value)}
                                    />

                                    <div className="flex gap-2 mt-3">
                                        <button 
                                            onClick={() => setHomeMode('home')} 
                                            className={`px-4 py-2 rounded text-sm font-semibold border ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>
                                            Back
                                        </button>
                                        <button 
                                            onClick={enterRoomAction} 
                                            className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold flex-1 hover:bg-blue-700">
                                            Enter Room
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* JOIN ROOM FORM */}
                            {homeMode === 'join' && (
                                <div className="flex flex-col text-left gap-3">
                                    <h2 className="text-md font-bold text-blue-400 mb-1">🚪 Join an Existing Room</h2>
                                    
                                    <label className="text-xs text-gray-400 font-semibold">Your Name:</label>
                                    <input
                                        type="text"
                                        placeholder="e.g. Sarah..."
                                        className={`border p-2.5 rounded text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                    />

                                    <label className="text-xs text-gray-400 font-semibold">Room Code:</label>
                                    <input
                                        type="text"
                                        placeholder="Enter 6-digit room code..."
                                        className={`border p-2.5 rounded text-sm font-mono ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={roomCode}
                                        onChange={(e) => setRoomCode(e.target.value)}
                                    />

                                    <label className="text-xs text-gray-400 font-semibold">Room Password (If required):</label>
                                    <input
                                        type="password"
                                        placeholder="Room password..."
                                        className={`border p-2.5 rounded text-sm ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                        value={roomPassword}
                                        onChange={(e) => setRoomPassword(e.target.value)}
                                    />

                                    <div className="flex gap-2 mt-4">
                                        <button 
                                            onClick={() => setHomeMode('home')} 
                                            className={`px-4 py-2 rounded text-sm font-semibold border ${darkMode ? 'border-gray-600' : 'border-gray-300'}`}>
                                            Back
                                        </button>
                                        <button 
                                            onClick={enterRoomAction} 
                                            className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold flex-1 hover:bg-blue-700">
                                            Join Room
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                );
            }

            // IN-ROOM VIEW
            return (
                <div className={`flex flex-col h-screen overflow-hidden pb-16 sm:pb-0 ${darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'}`}>
                    
                    {/* Minimalist Top Bar */}
                    <div className={`flex justify-between items-center px-4 py-2.5 border-b shadow-sm shrink-0 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                        <div className="flex items-center gap-3">
                            <div>
                                <h1 className="font-bold text-xs sm:text-sm text-blue-500 truncate max-w-[180px]">Room: {roomCode} {roomTopic ? `(${roomTopic})` : ''}</h1>
                                <p className="text-[10px] text-gray-400">👤 {username}</p>
                            </div>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="bg-red-500/10 text-red-500 border border-red-300 text-[10px] px-2 py-1 rounded font-semibold hover:bg-red-500 hover:text-white transition-all">
                                Leave Room
                            </button>
                        </div>

                        {/* Desktop Section Toggles */}
                        <div className="hidden sm:flex gap-2">
                            <button 
                                onClick={() => setActiveSection('workspace')} 
                                className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'workspace' ? 'bg-blue-600 text-white' : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                🖥️ Workspace
                            </button>
                            <button 
                                onClick={() => setActiveSection('chat')} 
                                className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'chat' ? 'bg-blue-600 text-white' : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                💬 Chat ({activeUsers.length})
                            </button>
                            <button 
                                onClick={() => setActiveSection('tools')} 
                                className={`px-3 py-1 rounded text-xs font-bold ${activeSection === 'tools' ? 'bg-blue-600 text-white' : darkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-700'}`}>
                                🛠️ Voice & Timer
                            </button>
                        </div>

                        <button 
                            onClick={() => setDarkMode(!darkMode)}
                            className="text-xs px-2 py-1 rounded border border-gray-500 hover:opacity-80">
                            {darkMode ? '☀️' : '🌙'}
                        </button>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto p-3 flex flex-col">
                        
                        {/* SECTION 1: WORKSPACE */}
                        {activeSection === 'workspace' && (
                            <div className="flex-1 flex flex-col gap-2 h-full">
                                <div className="flex justify-between items-center shrink-0">
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setWorkspaceTab('notes')} 
                                            className={`px-3 py-1 text-xs font-bold rounded ${workspaceTab === 'notes' ? 'bg-blue-500 text-white' : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            📝 Notes
                                        </button>
                                        <button 
                                            onClick={() => setWorkspaceTab('whiteboard')} 
                                            className={`px-3 py-1 text-xs font-bold rounded ${workspaceTab === 'whiteboard' ? 'bg-blue-500 text-white' : darkMode ? 'bg-gray-800 text-gray-400' : 'bg-gray-200 text-gray-700'}`}>
                                            🎨 Whiteboard
                                        </button>
                                    </div>

                                    {workspaceTab === 'whiteboard' && (
                                        <div className="flex items-center gap-1.5">
                                            <input 
                                                type="color" 
                                                value={brushColor} 
                                                onChange={(e) => setBrushColor(e.target.value)}
                                                className="w-5 h-5 rounded border cursor-pointer"
                                            />
                                            <select 
                                                value={brushSize} 
                                                onChange={(e) => setBrushSize(Number(e.target.value))}
                                                className={`text-[11px] p-0.5 rounded ${darkMode ? 'bg-gray-800 text-white' : 'bg-white border'}`}>
                                                <option value={2}>Thin</option>
                                                <option value={4}>Med</option>
                                                <option value={8}>Thick</option>
                                            </select>
                                            <button 
                                                onClick={clearBoard} 
                                                className="bg-red-500 text-white px-2 py-0.5 rounded text-[11px] font-semibold">
                                                Clear
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className={`flex-1 flex flex-col p-3 rounded-lg shadow-sm relative overflow-hidden min-h-[300px] ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    {workspaceTab === 'notes' ? (
                                        <textarea
                                            value={noteText}
                                            onChange={handleNoteChange}
                                            placeholder="Type shared notes here..."
                                            className={`flex-1 border p-3 rounded resize-none focus:outline-none text-sm min-h-[250px] ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-white border-gray-200 text-black'}`}
                                        />
                                    ) : (
                                        <div className="flex-1 w-full relative border rounded overflow-hidden bg-white touch-none min-h-[300px]">
                                            <canvas
                                                ref={canvasRef}
                                                width={800}
                                                height={500}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseLeave={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full h-full block cursor-crosshair"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* SECTION 2: CHAT & MEMBERS */}
                        {activeSection === 'chat' && (
                            <div className={`flex-1 flex flex-col p-3 rounded-lg shadow-sm h-full max-w-2xl mx-auto w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <div className={`mb-2 p-2 rounded border text-[11px] shrink-0 ${darkMode ? 'bg-gray-900 border-gray-700 text-gray-300' : 'bg-blue-50 border-blue-100 text-blue-800'}`}>
                                    <span className="font-bold">Online ({activeUsers.length}): </span>
                                    {activeUsers.map((u) => (
                                        <span key={u.id} className="inline-block bg-blue-500 text-white px-1.5 py-0.5 rounded-full text-[9px] mr-1 my-0.5">
                                            {u.username}
                                        </span>
                                    ))}
                                </div>

                                <div className={`flex-1 border overflow-y-auto p-2.5 mb-2 rounded ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                                    {chatList.map((item, index) => (
                                        <div key={index} className="mb-2.5 text-xs">
                                            <span className="font-bold text-blue-400">{item.username}</span> 
                                            <span className="text-[10px] text-gray-400 ml-2">{item.time}</span>
                                            {item.message ? (
                                                <p className={darkMode ? 'text-gray-200 mt-0.5' : 'text-gray-700 mt-0.5'}>{item.message}</p>
                                            ) : (
                                                <div className="mt-1">
                                                    {item.fileType && item.fileType.startsWith('image/') ? (
                                                        <div>
                                                            <img src={item.fileUrl} alt={item.fileName} className="max-w-[160px] rounded border my-1 shadow-sm" />
                                                            <a href={item.fileUrl} download={item.fileName} className="text-blue-400 underline text-[10px] block">
                                                                Download {item.fileName}
                                                            </a>
                                                        </div>
                                                    ) : (
                                                        <a href={item.fileUrl} download={item.fileName} className="text-blue-500 underline font-semibold flex items-center gap-1">
                                                            📎 {item.fileName}
                                                        </a>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={sendMessage} className="flex flex-col gap-1.5 shrink-0">
                                    <div className="flex gap-1.5">
                                        <input
                                            type="text"
                                            value={message}
                                            placeholder="Type message..."
                                            className={`border flex-1 p-2 rounded text-xs ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white'}`}
                                            onChange={(e) => setMessage(e.target.value)}
                                        />
                                        <button type="submit" className="bg-blue-500 text-white px-3 py-2 rounded text-xs font-bold">Send</button>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <input 
                                            type="file" 
                                            onChange={handleFileUpload}
                                            className="text-[10px] text-gray-400 file:mr-1 file:py-0.5 file:px-1.5 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-blue-700"
                                        />
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* SECTION 3: TOOLS */}
                        {activeSection === 'tools' && (
                            <div className="flex-1 flex flex-col gap-3 max-w-xl mx-auto w-full">
                                <div className={`p-4 rounded-lg shadow-sm border ${darkMode ? 'bg-gray-800 border-purple-900' : 'bg-purple-50 border-purple-200'}`}>
                                    <h3 className={`font-bold text-sm mb-1 ${darkMode ? 'text-purple-300' : 'text-purple-800'}`}>🎙️ Voice Chat</h3>
                                    <p className="text-[11px] text-gray-400 mb-3">
                                        {isInVoice ? 'Connected to voice' : 'Disconnected'}
                                    </p>
                                    <div className="flex flex-wrap gap-2">
                                        <button 
                                            onClick={toggleVoiceChat} 
                                            className={`px-3 py-1.5 rounded text-xs font-semibold text-white ${isInVoice ? 'bg-red-500 hover:bg-red-600' : 'bg-purple-600 hover:bg-purple-700'}`}>
                                            {isInVoice ? 'Leave Voice' : 'Join Voice'}
                                        </button>
                                        {isInVoice && (
                                            <button 
                                                onClick={toggleMute} 
                                                className={`px-3 py-1.5 rounded text-xs font-semibold text-white ${isMuted ? 'bg-amber-600' : 'bg-gray-600'}`}>
                                                {isMuted ? 'Unmute' : 'Mute'}
                                            </button>
                                        )}
                                        {!isMobile && (
                                            <button 
                                                onClick={toggleScreenShare} 
                                                className={`px-3 py-1.5 rounded text-xs font-semibold text-white ${isSharingScreen ? 'bg-red-500' : 'bg-blue-600'}`}>
                                                {isSharingScreen ? 'Stop Screen' : 'Share Screen'}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <div className={`p-4 rounded-lg shadow-sm flex items-center justify-between ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <div>
                                        <h3 className={`font-bold text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>⏱️ Study Timer</h3>
                                        <div className="text-3xl font-extrabold text-blue-400 mt-1">{formatTime(timeLeft)}</div>
                                    </div>
                                    <div className="flex gap-1.5">
                                        <button onClick={() => socket.emit('start_timer', roomCode)} className="bg-green-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Start</button>
                                        <button onClick={() => socket.emit('pause_timer', roomCode)} className="bg-yellow-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Pause</button>
                                        <button onClick={() => socket.emit('reset_timer', roomCode)} className="bg-red-600 text-white px-2.5 py-1.5 rounded text-xs font-bold">Reset</button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Mobile Bottom Navigation Bar */}
                    <div className={`sm:hidden fixed bottom-0 left-0 right-0 h-16 border-t flex justify-around items-center px-2 z-50 shadow-lg ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
                        <button 
                            onClick={() => setActiveSection('workspace')} 
                            className={`flex flex-col items-center justify-center flex-1 py-1 text-xs font-bold ${activeSection === 'workspace' ? 'text-blue-500' : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-lg">🖥️</span>
                            <span>Workspace</span>
                        </button>
                        <button 
                            onClick={() => setActiveSection('chat')} 
                            className={`flex flex-col items-center justify-center flex-1 py-1 text-xs font-bold ${activeSection === 'chat' ? 'text-blue-500' : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-lg">💬</span>
                            <span>Chat</span>
                        </button>
                        <button 
                            onClick={() => setActiveSection('tools')} 
                            className={`flex flex-col items-center justify-center flex-1 py-1 text-xs font-bold ${activeSection === 'tools' ? 'text-blue-500' : darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                            <span className="text-lg">🛠️</span>
                            <span>Tools</span>
                        </button>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
